name: 📦 Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to publish to'
        required: true
        default: 'pypi'
        type: choice
        options:
          - pypi
          - testpypi

permissions:
  contents: read

jobs:
  build-and-publish:
    name: 🚀 Build and Publish Package
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 📦 Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.5.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: 🧪 Run tests
        run: |
          poetry install -E excel
          poetry run pytest -q

      - name: 🔍 Verify version
        run: |
          VERSION=$(poetry version -s)
          echo "📌 Publishing version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      
      - name: 🏗️ Build package
        run: poetry build
      
      - name: 📋 List build artifacts
        run: |
          echo "📦 Build artifacts:"
          ls -lh dist/
      
      - name: 🚀 Publish to PyPI
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'pypi')
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          echo "🚀 Publishing to PyPI..."
          poetry publish
      
      - name: 🧪 Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.environment == 'testpypi'
        env:
          POETRY_REPOSITORIES_TESTPYPI_URL: https://test.pypi.org/legacy/
          POETRY_PYPI_TOKEN_TESTPYPI: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          echo "🧪 Publishing to TestPyPI..."
          poetry config repositories.testpypi https://test.pypi.org/legacy/
          poetry publish -r testpypi
      
      - name: ✅ Success
        run: |
          echo "✨ Successfully published linkedin-tarantula v${{ env.VERSION }}!"
          echo "📦 Install with: pip install linkedin-tarantula"
          echo "🔧 Run with: linkedin-spider"
