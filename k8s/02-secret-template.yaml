# Template for Kubernetes Secret
# Generate actual secret using: python -m linkedin_spider.cli.extract_cookies --k8s-secret
apiVersion: v1
kind: Secret
metadata:
  name: linkedin-credentials
  namespace: linkedin-spider
type: Opaque
data:
  # Base64-encoded LinkedIn cookies (replace with actual value)
  # Generated by cookie extraction script
  cookies: ""
stringData:
  # Database credentials (replace CHANGE_ME in both)
  POSTGRES_PASSWORD: "CHANGE_ME"
  DATABASE_URL: "postgresql://postgres:CHANGE_ME@postgres:5432/linkedin_spider"
  # Optional: LinkedIn credentials for fallback
  LINKEDIN_EMAIL: ""
  LINKEDIN_PASSWORD: ""
